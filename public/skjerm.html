<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainee Pursuit – storskjerm</title>
<link rel="stylesheet" href="/shared.css">
<style>
  html, body { height: 100%; overflow: hidden; background: var(--stage-deep); }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center; background: var(--stage);
    overflow: hidden;
  }
  .view { position: absolute; inset: 0; padding: 72px 96px; }

  /* Lobby */
  .lobby { display: grid; grid-template-columns: 1fr 560px; grid-template-rows: 1fr auto; column-gap: 96px; }
  .lobby .wordmark { font-size: 188px; align-self: center; }
  .lobby .event { font-family: var(--display); font-size: 44px; color: var(--cream-dim); margin-top: 28px; }
  .join-card { background: var(--cream); color: var(--stage); border-radius: 28px; padding: 44px; align-self: center; text-align: center; }
  .join-card .qr { width: 400px; height: 400px; margin: 0 auto; }
  .join-card .qr svg { width: 100%; height: 100%; display: block; }
  .join-card .qr-fallback { font-size: 32px; font-weight: 700; padding: 80px 0; }
  .join-card h2 { font-family: var(--display); font-weight: 400; font-size: 46px; margin: 28px 0 4px; }
  .join-card .url { font-size: 30px; font-weight: 700; }
  .joined { font-size: 26px; margin-top: 18px; color: #4b4a86; }
  .teams-row { grid-column: 1 / -1; display: flex; gap: 72px; align-items: center; }
  .team-mini { display: flex; align-items: center; gap: 20px; font-size: 32px; font-weight: 700; }
  .team-mini svg { width: 96px; height: 96px; }

  /* Kategori */
  .category { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; color: var(--stage-deep); }
  .category .meta { font-size: 40px; font-weight: 700; opacity: .75; margin-bottom: 24px; }
  .category .name { font-family: var(--display); font-size: 176px; line-height: .92; max-width: 1080px; }
  .category .big-wedge { position: absolute; right: 110px; top: 210px; width: 660px; height: 660px; animation: wedge-in 700ms cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes wedge-in { from { transform: rotate(-40deg) scale(.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .category .big-wedge { animation: none; } }

  /* Spørsmål og fasit */
  .question { display: grid; grid-template-rows: auto auto 1fr auto; gap: 40px; border-left: 28px solid var(--cat); padding-left: 80px; }
  .qhead { display: flex; justify-content: space-between; align-items: center; }
  .qhead .cat { font-family: var(--display); font-size: 44px; color: var(--cat); }
  .qhead .meta { font-size: 30px; color: var(--cream-dim); margin-top: 6px; }
  .timer { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 72px; background: var(--cream); color: var(--stage); position: relative; }
  .timer svg { position: absolute; inset: -10px; width: 170px; height: 170px; transform: rotate(-90deg); }
  .timer circle { fill: none; stroke: var(--cat); stroke-width: 10; stroke-linecap: round; }
  .timer.done { background: var(--cat); font-size: 46px; }
  .qtext { font-size: 64px; font-weight: 700; line-height: 1.15; max-width: 1600px; margin: 0; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-content: start; }
  .opt { background: var(--cream); color: var(--stage); border-radius: 22px; padding: 28px 32px; display: flex; align-items: center; gap: 28px; font-size: 44px; font-weight: 700; position: relative; overflow: hidden; min-height: 132px; }
  .opt .letter { flex: none; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--stage); color: var(--cream); font-family: var(--display); font-size: 40px; }
  .opt .label { position: relative; }
  .opt .bar { position: absolute; left: 0; bottom: 0; height: 12px; background: var(--stage-lift); opacity: .5; }
  .opt .count { margin-left: auto; font-size: 36px; position: relative; }
  .opt.wrong { opacity: .32; }
  .opt.right { background: var(--cat); color: var(--stage-deep); box-shadow: 0 0 0 6px var(--cream); }
  .opt.right .bar { background: var(--stage-deep); opacity: .35; }
  .number-prompt { background: var(--cream); color: var(--stage); border-radius: 22px; padding: 40px 48px; font-size: 48px; font-weight: 700; align-self: start; justify-self: start; }
  .qfoot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 34px; }
  .qfoot .count strong { font-family: var(--display); font-weight: 400; font-size: 64px; margin-right: 12px; }
  .qfoot .mini-join { display: flex; align-items: center; gap: 24px; color: var(--cream-dim); }
  .qfoot .mini-join .qr { width: 130px; height: 130px; background: var(--cream); padding: 10px; border-radius: 12px; }
  .qfoot .mini-join .qr svg { width: 100%; height: 100%; display: block; }

  .reveal-body { display: grid; grid-template-columns: 1fr 600px; gap: 56px; align-items: start; }
  .reveal-body .options { grid-template-columns: 1fr; gap: 20px; }
  .reveal-body .opt { min-height: 104px; font-size: 38px; padding: 20px 28px; }
  .reveal-body .opt .letter { width: 62px; height: 62px; font-size: 32px; }
  .panel h3 { font-family: var(--display); font-weight: 400; font-size: 40px; margin: 0 0 24px; }
  .gbar { margin-bottom: 26px; }
  .gbar .row { display: flex; justify-content: space-between; font-size: 32px; font-weight: 700; margin-bottom: 8px; }
  .gbar .track { height: 30px; background: var(--stage-lift); border-radius: 15px; overflow: hidden; }
  .gbar .fill { height: 100%; background: var(--cat); border-radius: 15px; transition: width 900ms cubic-bezier(.2,.9,.3,1); }
  .gbar .row .val { font-family: var(--display); font-weight: 400; }
  .callout { margin-top: 36px; font-size: 32px; border-top: 2px solid var(--line); padding-top: 28px; }
  .callout strong { color: var(--cat); }
  .big-answer { font-family: var(--display); font-size: 200px; line-height: 1; color: var(--cat); }
  .big-answer-label { font-size: 36px; color: var(--cream-dim); margin-top: 12px; }

  /* Kakestilling */
  .board { display: flex; flex-direction: column; }
  .board h2 { font-family: var(--display); font-weight: 400; font-size: 72px; margin: 0 0 56px; }
  .board .cakes { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 64px; align-items: center; }
  .board .team { text-align: center; }
  .board .team svg { width: 440px; height: 440px; margin: 0 auto; }
  .board .team .name { font-family: var(--display); font-size: 52px; margin-top: 36px; }
  .board .team .score { font-size: 32px; color: var(--cream-dim); margin-top: 6px; }
  .board .team.full .name { color: var(--hist, #F4C430); }

  /* Toppliste */
  .leader { display: grid; grid-template-columns: 1fr 1fr; gap: 96px; align-items: center; }
  .leader h2 { font-family: var(--display); font-weight: 400; font-size: 120px; line-height: .95; margin: 0; }
  .leader ol { list-style: none; margin: 0; padding: 0; counter-reset: r; }
  .leader li { counter-increment: r; display: grid; grid-template-columns: 90px 1fr auto; align-items: center; gap: 24px; font-size: 44px; font-weight: 700; padding: 22px 0; border-bottom: 2px solid var(--line); }
  .leader li::before { content: counter(r); font-family: var(--display); font-size: 60px; color: var(--cream-dim); }
  .leader li:first-child::before { color: #F4C430; }
  .leader .grp { display: block; font-size: 26px; font-weight: 400; color: var(--cream-dim); }
  .leader .pts { font-family: var(--display); font-weight: 400; }

  /* Vinner */
  .winner { display: grid; grid-template-columns: 640px 1fr; gap: 96px; align-items: center; }
  .winner svg { width: 640px; height: 640px; animation: spin-in 1100ms cubic-bezier(.2,1.2,.3,1) both; }
  @keyframes spin-in { from { transform: rotate(-200deg) scale(.3); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .winner svg { animation: none; } }
  .winner .sub { font-size: 44px; color: var(--cream-dim); margin-bottom: 20px; }
  .winner .team-name { font-family: var(--display); font-size: 170px; line-height: .9; }

  .offline { position: absolute; right: 24px; bottom: 16px; font-size: 22px; color: var(--bad); }
</style>
</head>
<body>
<div id="stage" aria-live="polite"></div>
<script type="module">
import { fmt, api, syncClock, now, secondsLeft, h, cakeSVG, qrSVG, catOf, groupName, teamName, LETTERS, poll } from '/shared.js';

const stage = document.getElementById('stage');
const joinUrl = location.origin + '/';
const prettyUrl = location.host;
let current = null;  // siste tilstand
let renderedKey = '';

function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${k})`;
}
addEventListener('resize', fit); fit();

const joinedLine = (st) => {
  const total = Object.values(st.players).reduce((a, b) => a + b, 0);
  if (!total) return 'Ingen er med ennå. Bli den første!';
  return `${total} med: ` + st.game.groups.map((g) => `${st.players[g.id]} ${g.name.toLowerCase()}`).join(', ');
};

function lobby(st) {
  return h('section', { class: 'view lobby' },
    h('div', {},
      h('h1', { class: 'wordmark', style: { fontSize: '188px' } }, h('span', {}, 'Trainee'), h('span', {}, 'Pursuit')),
      h('div', { class: 'event' }, st.game.event)),
    h('div', { class: 'join-card' },
      qrSVG(joinUrl),
      h('h2', {}, 'Skann og spill med'),
      h('div', { class: 'url' }, prettyUrl),
      h('div', { class: 'joined', id: 'joined' }, joinedLine(st))),
    h('div', { class: 'teams-row' }, st.game.teams.map((t) =>
      h('div', { class: 'team-mini' }, cakeSVG(st.game.categories, st.cakes[t.id], t.name), t.name))));
}

function category(st) {
  const c = catOf(st.game, st.question.cat);
  const wedge = cakeSVG(st.game.categories, [c.id], c.name);
  wedge.classList.add('big-wedge');
  wedge.querySelector('.wedge')?.setAttribute('fill', 'var(--cream)'); // synlig mot kategorifargen
  return h('section', { class: 'view category', style: { background: c.color } },
    h('div', { class: 'meta' }, `${st.question.round}, spørsmål ${st.question.n} av ${st.totalQuestions}`),
    h('div', { class: 'name' }, c.name),
    wedge);
}

function timer(st) {
  const left = secondsLeft(st.deadline);
  const frac = Math.max(0, Math.min(1, (st.deadline - now()) / (st.duration * 1000)));
  const C = 2 * Math.PI * 75;
  const el = h('div', { class: 'timer' + (left === 0 ? ' done' : ''), id: 'timer' }, left === 0 ? 'Tid!' : left);
  el.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="75" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg>`);
  return el;
}

function qhead(st, withTimer) {
  const c = catOf(st.game, st.question.cat);
  return h('div', { class: 'qhead' },
    h('div', {}, h('div', { class: 'cat' }, c.name), h('div', { class: 'meta' }, `${st.question.round}, spørsmål ${st.question.n} av ${st.totalQuestions}`)),
    withTimer ? timer(st) : null);
}

function question(st) {
  const q = st.question;
  const c = catOf(st.game, q.cat);
  const body = q.type === 'mc'
    ? h('div', { class: 'options' }, q.options.map((o, i) =>
        h('div', { class: 'opt' }, h('span', { class: 'letter' }, LETTERS[i]), h('span', { class: 'label' }, o))))
    : h('div', { class: 'number-prompt' }, `Svar på mobilen med et tall${q.unit ? ` (${q.unit})` : ''}. Nærmest vinner.`);
  return h('section', { class: 'view question', style: { '--cat': c.color } },
    qhead(st, true),
    h('p', { class: 'qtext' }, q.text),
    body,
    h('div', { class: 'qfoot' },
      h('div', { class: 'count' }, h('strong', { id: 'answers' }, st.answers), 'svar fra salen'),
      h('div', { class: 'mini-join' }, h('span', {}, prettyUrl), qrSVG(joinUrl))));
}

function groupBars(st, r, mode) {
  return st.game.groups.map((g) => {
    const s = r.stats[g.id];
    const val = mode === 'pct' ? (s.pct == null ? 'Ingen svar' : `${s.pct} %`) : (s.median == null ? 'Ingen svar' : fmt(s.median));
    const width = mode === 'pct' ? (s.pct ?? 0) : 0;
    return h('div', { class: 'gbar' },
      h('div', { class: 'row' }, h('span', {}, g.name), h('span', { class: 'val' }, val)),
      mode === 'pct' ? h('div', { class: 'track' }, h('div', { class: 'fill', style: { width: '0%' }, 'data-w': width })) : null);
  });
}

function reveal(st) {
  const q = st.question;
  const r = st.reveal;
  const c = catOf(st.game, q.cat);
  let left;
  let panel;
  if (q.type === 'mc') {
    const max = Math.max(1, ...r.dist);
    left = h('div', { class: 'options' }, q.options.map((o, i) =>
      h('div', { class: 'opt ' + (i === r.answer ? 'right' : 'wrong') },
        h('div', { class: 'bar', style: { width: `${(100 * r.dist[i]) / max}%` } }),
        h('span', { class: 'letter' }, LETTERS[i]),
        h('span', { class: 'label' }, o),
        h('span', { class: 'count' }, r.dist[i]))));
    panel = h('div', { class: 'panel' },
      h('h3', {}, 'Andel riktige i salen'),
      groupBars(st, r, 'pct'),
      r.fastest ? h('div', { class: 'callout' }, 'Raskest med riktig svar: ', h('strong', {}, r.fastest.nick), ` (${String(r.fastest.seconds).replace('.', ',')} s)`) : null);
  } else {
    left = h('div', {},
      h('div', { class: 'big-answer' }, r.answerLabel.split(' (')[0]),
      h('div', { class: 'big-answer-label' }, q.unit ? `Riktig svar, ${q.unit}` : 'Riktig svar'));
    panel = h('div', { class: 'panel' },
      h('h3', {}, 'Salen gjettet (median)'),
      groupBars(st, r, 'median'),
      r.closest ? h('div', { class: 'callout' }, 'Nærmest i salen: ', h('strong', {}, r.closest.nick), ` (${fmt(r.closest.value)})`) : null);
  }
  return h('section', { class: 'view question', style: { '--cat': c.color } },
    qhead(st, false),
    h('p', { class: 'qtext', style: { fontSize: '48px' } }, q.text),
    h('div', { class: 'reveal-body' }, left, panel),
    h('div', { class: 'qfoot' }, h('div', { class: 'count' }, h('strong', {}, r.total), 'svar fra salen'), h('span', {})));
}

function board(st) {
  return h('section', { class: 'view board' },
    h('h2', {}, 'Kakestillingen'),
    h('div', { class: 'cakes' }, st.game.teams.map((t) => {
      const n = st.cakes[t.id].length;
      return h('div', { class: 'team' + (n === st.game.categories.length ? ' full' : '') },
        cakeSVG(st.game.categories, st.cakes[t.id], `${t.name}: ${n} av ${st.game.categories.length}`),
        h('div', { class: 'name' }, t.name),
        h('div', { class: 'score' }, `${n} av ${st.game.categories.length} kakestykker`));
    })));
}

function leaderboard(st) {
  return h('section', { class: 'view leader' },
    h('h2', {}, 'Skarpest i salen'),
    st.leaderboard?.length
      ? h('ol', {}, st.leaderboard.map((p) => h('li', {}, h('span', {}, p.nick, h('span', { class: 'grp' }, groupName(st.game, p.group))), h('span', { class: 'pts' }, p.total.toLocaleString('nb-NO')))))
      : h('p', { class: 'muted', style: { fontSize: '40px' } }, 'Ingen poeng ennå.'));
}

function winner(st) {
  const all = st.game.categories.map((c) => c.id);
  return h('section', { class: 'view winner' },
    cakeSVG(st.game.categories, all, 'Full kake'),
    h('div', {}, h('div', { class: 'sub' }, `Vinner av Trainee Pursuit ${st.game.event.replace(/\D+/g, '')}`), h('div', { class: 'team-name' }, teamName(st.game, st.winner))));
}

const views = { lobby, category, question, reveal, board, leaderboard, winner };

function render(st) {
  const key = `${st.rev}`;
  if (key !== renderedKey) {
    renderedKey = key;
    stage.replaceChildren((views[st.phase] ?? lobby)(st));
    requestAnimationFrame(() => requestAnimationFrame(() =>
      stage.querySelectorAll('.fill[data-w]').forEach((f) => { f.style.width = f.dataset.w + '%'; })));
  } else {
    const a = document.getElementById('answers'); if (a) a.textContent = st.answers;
    const j = document.getElementById('joined'); if (j) j.textContent = joinedLine(st);
  }
}

// Nedtellingen oppdateres lokalt hvert kvartsekund, uavhengig av polling.
setInterval(() => {
  if (current?.phase !== 'question') return;
  const t = document.getElementById('timer');
  if (t) t.replaceWith(timer(current));
}, 250);

let offlineEl;
poll(async () => {
  try {
    const st = await api('state');
    syncClock(st.serverNow);
    current = st;
    render(st);
    offlineEl?.remove(); offlineEl = null;
  } catch (e) {
    if (!offlineEl) { offlineEl = h('div', { class: 'offline' }, 'Mistet kontakt med serveren. Prøver igjen …'); stage.append(offlineEl); }
  }
}, 1000);
</script>
</body>
</html>
